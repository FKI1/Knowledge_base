services:
  db:
    image: postgres:16
    network_mode: bridge
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: kb
    ports: ["127.0.0.1:54329:5432"]   # порт виден только локально
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: